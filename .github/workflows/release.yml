name: Windows installer release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prepare relay test dependency
        run: python -m pip install cryptography
      - name: Check source license headers
        run: python Tools/audit_source_headers.py
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION=$version"
          }
      - name: Regression tests
        run: |
          dotnet run --project AmigaEmulator.Tests -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s relay_server -v
          exit $LASTEXITCODE
      - name: Prepare Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'))) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build installer without ROMs
        run: ./scripts/build-installer.ps1
      - name: Test real installation, update and uninstall
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AmigaEmulator-win-x64-setup
          path: artifacts/installer/*
          if-no-files-found: error
      - name: Publish GitHub Release on version tags
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $files = @(Get-ChildItem artifacts/installer -File | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "Amiga Emulator $version" --generate-notes
          }
          exit $LASTEXITCODE
